<div class="col-md-12">
    <div class="col-md-12 d-flex flex-column align-items-center my-4">
        <div class="col-md-11">
            <p class="text-poppins fs-3 text-white fw-semibold ms-1">Resumo Financeiro</p>
            <hr style="color: white;">
        </div>
    </div>

    <div class="col-12 d-flex justify-content-center">
        <div class="col-md-11 d-flex justify-content-between">
            <div class="col-md-3 shadow-box bg-danger border rounded p-3">
                <div class="text-white">
                    <h5>Entradas</h5>
                </div>
                <div class="text-white">
                    <h2>R$ 5.132,00</h2>
                </div>
            </div>

            <div class="col-md-3 shadow-box bg-primary border rounded p-3">
                <div class="text-white">
                    <h5>Saídas</h5>
                </div>
                <div class="text-white">
                    <h2>R$ 11.230,00</h2>
                </div>
            </div>

            <div class="col-md-3 shadow-box bg-success border rounded p-3">
                <div class="text-white">
                    <h5>Lucro Resumido</h5>
                </div>
                <div class="text-white">
                    <h2>R$ 7.200,00</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 d-flex justify-content-center mt-5">
        <div class="col-md-11 d-flex justify-content-center">
            <div class="col-md-12">
                <table class="table table-dark table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th>Nome do Produto</th>
                            <th>Quantidade</th>
                            <th>Data de Saída</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let produto of produtos">
                            <td>{{ produto.nome }}</td>
                            <td>{{ produto.quantidade }}</td>
                            <td>{{ produto.dataSaida }}</td>
                            <td>{{ produto.preco | currency:'BRL' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
